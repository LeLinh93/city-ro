<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Little City" />
    <meta name="theme-color" content="#2b62a6" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Little City</title>
  </head>
  <body class="in-menu">
    <div id="game"></div>

    <div id="menu">
      <h1 id="menu-title">City Builder</h1>
      <div id="menu-panel">
        <button id="new-city" aria-label="New city">＋</button>
        <div id="city-list"></div>
      </div>
    </div>

    <div id="hud">
      <div id="hint"></div>
      <button id="stop-disaster" class="hidden" aria-label="Stop the disaster">⏹ Stop disaster</button>
      <div id="topbar">
        <button id="zoom-out" class="round" aria-label="Zoom out">➖</button>
        <button id="zoom-in" class="round" aria-label="Zoom in">➕</button>
        <button id="home" class="round" aria-label="Back to menu">🏠</button>
      </div>
      <div id="place" class="hidden">
        <button id="place-ok" class="round" aria-label="Build">✔</button>
        <button id="place-no" class="round" aria-label="Cancel">✖</button>
        <button id="place-flip" class="round" aria-label="Turn">🔄</button>
      </div>
      <div id="submenu" class="hidden"></div>
      <div id="toolbar"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
