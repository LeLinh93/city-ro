<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Little City" />
    <meta name="theme-color" content="#2b62a6" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Little City</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hint"></div>
    <div id="topbar">
      <button id="zoom-out" class="round" aria-label="Zoom out">➖</button>
      <button id="zoom-in" class="round" aria-label="Zoom in">➕</button>
      <button id="new-island" class="round" aria-label="New island">🏝️</button>
    </div>
    <button id="rotate" class="round hidden" aria-label="Turn building">🔄</button>
    <div id="toolbar"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
